# aegis-cli - Command line interface

[package]
name = "aegis-cli"
version = "0.1.0"
edition = "2021"
description = "AEGIS AV - Command line interface"
license = "Apache-2.0"

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-engine = { path = "../aegis-engine" }
aegis-config = { path = "../aegis-config" }
aegis-quarantine = { path = "../aegis-quarantine" }
aegis-signatures = { path = "../aegis-signatures" }
aegis-scanner = { path = "../aegis-scanner" }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
console = { workspace = true }
indicatif = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
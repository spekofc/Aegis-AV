<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00cc6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00aa55;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Shield Background -->
  <path d="M128 16 C189.4 16 240 60.6 240 112 C240 163.4 198.4 224 128 240 C57.6 224 16 163.4 16 112 C16 60.6 67.6 16 128 16 Z"
        fill="url(#shieldGradient)"
        stroke="url(#accentGradient)"
        stroke-width="2"
        filter="url(#glow)"/>

  <!-- Shield Inner Highlight -->
  <path d="M128 32 C172.4 32 208 63.6 208 104 C208 144.4 172.4 192 128 216 C83.6 192 48 144.4 48 104 C48 63.6 83.6 32 128 32 Z"
        fill="none"
        stroke="url(#accentGradient)"
        stroke-width="0.5"
        opacity="0.3"/>

  <!-- Central Hexagon (AEGIS Core) -->
  <polygon points="128,58 156,74 156,102 128,118 100,102 100,74"
           fill="url(#accentGradient)"
           opacity="0.9"
           filter="url(#glow)"/>

  <!-- Hexagon Inner -->
  <polygon points="128,66 147,78 147,96 128,110 109,96 109,78"
           fill="#0a0a1a"
           opacity="0.8"/>

  <!-- AEGIS Text -->
  <text x="128" y="165" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">AEGIS</text>
  <text x="128" y="188" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="14" font-weight="400" fill="#00ff88" text-anchor="middle" letter-spacing="2">AV</text>

  <!-- Circuit Lines -->
  <g stroke="#00ff88" stroke-width="1" opacity="0.4" filter="url(#glow)">
    <line x1="128" y1="138" x2="80" y2="170"/>
    <line x1="128" y1="138" x2="176" y2="170"/>
    <line x1="80" y1="170" x2="60" y2="190"/>
    <line x1="176" y1="170" x2="196" y2="190"/>
    <circle cx="60" cy="190" r="3" fill="#00ff88" opacity="0.6"/>
    <circle cx="196" cy="190" r="3" fill="#00ff88" opacity="0.6"/>
  </g>

  <!-- Corner Accents -->
  <g stroke="#00ff88" stroke-width="1.5" opacity="0.5">
    <!-- Top Left -->
    <path d="M40 40 H60 M40 40 V60"/>
    <!-- Top Right -->
    <path d="M216 40 H196 M216 40 V60"/>
    <!-- Bottom Left -->
    <path d="M40 180 H60 M40 216 V196"/>
    <!-- Bottom Right -->
    <path d="M216 180 H196 M216 216 V196"/>
  </g>
</svg>
# aegis-config - Configuration management

[package]
name = "aegis-config"
version = "0.1.0"
edition = "2021"
description = "AEGIS AV - Configuration management"
license = "Apache-2.0"

[dependencies]
aegis-core = { path = "../aegis-core" }
aegis-telemetry = { path = "../aegis-telemetry", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
notify = "6.1"
dirs = "5.0"
zeroize = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
tracing = { workspace = true }
getrandom = "0.2"
base64 = "0.21"
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
hostname = "0.3"
rand = "0.8"
async-trait = "0.1"
windows = { workspace = true, features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Security"] }
hex = { workspace = true }

[dev-dependencies]
tempfile = "3.10"